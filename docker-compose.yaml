# =============================================================================
# DouyinLiveRecorder Docker Compose 配置
# 支持抖音、TikTok、YouTube等60+平台直播录制工具
# =============================================================================

services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ihmily/douyin-live-recorder:latest
    container_name: douyin-live-recorder

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
      - TERM=xterm-256color

    tty: true
    stdin_open: true

    volumes:
      # 配置文件（必需）
      - ./config:/app/config:rw
      # 下载目录（录制文件输出）
      - ./downloads:/app/downloads:rw
      # 日志目录
      - ./logs:/app/logs:rw
      # 备份目录
      - ./backup_config:/app/backup_config:rw

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*main.py' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - recorder-network

networks:
  recorder-network:
    name: douyin-recorder-network
    driver: bridge